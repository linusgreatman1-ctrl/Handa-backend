<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handa Admin</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'DM Sans',Segoe UI,Arial,sans-serif;background:#111;color:#F2EDE8;min-height:100vh}
  a{color:inherit}
  .hidden{display:none !important}
  /* ── Login screen ── */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{width:100%;max-width:360px;background:#1C1C1C;border:1px solid #2a2a2a;border-radius:16px;padding:28px}
  .login-box h1{font-size:20px;margin-bottom:4px}
  .login-box p{color:#9A9390;font-size:13px;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#9A9390;margin-bottom:6px}
  .field input{width:100%;padding:11px 13px;border-radius:10px;border:2px solid #333;background:#2D2D2D;color:#F2EDE8;font-size:14px;outline:none}
  .field input:focus{border-color:#E8392E}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:10px;border:none;background:#E8392E;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .err{color:#E8392E;font-size:13px;margin-top:10px;min-height:16px}
  /* ── App shell ── */
  #app-screen{display:flex;min-height:100vh}
  nav{width:220px;flex-shrink:0;background:#1C1C1C;border-right:1px solid #2a2a2a;padding:20px 0;display:flex;flex-direction:column}
  nav .brand{padding:0 20px 20px;font-weight:800;font-size:18px}
  nav .brand span{color:#E8392E}
  nav button.nav-item{display:block;width:100%;text-align:left;padding:12px 20px;background:none;border:none;color:#9A9390;font-size:14px;font-weight:600;cursor:pointer;border-left:3px solid transparent}
  nav button.nav-item.on{color:#F2EDE8;border-left-color:#E8392E;background:rgba(232,57,46,.08)}
  nav .spacer{flex:1}
  nav .who{padding:14px 20px;font-size:12px;color:#9A9390;border-top:1px solid #2a2a2a}
  nav .who b{color:#F2EDE8;display:block;font-size:13px}
  nav button.logout{margin:8px 20px 0;padding:8px;border-radius:8px;border:1px solid #333;background:transparent;color:#9A9390;font-size:12px;cursor:pointer}
  main{flex:1;padding:28px 32px;overflow-x:auto}
  main h2{font-size:20px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
  .card{background:#1C1C1C;border:1px solid #2a2a2a;border-radius:14px;padding:16px}
  .card .label{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#9A9390;margin-bottom:8px}
  .card .value{font-size:24px;font-weight:800}
  .card .breakdown{margin-top:10px;font-size:12px;color:#9A9390;display:flex;flex-direction:column;gap:3px}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#1C1C1C;border:1px solid #2a2a2a;border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #2a2a2a}
  th{color:#9A9390;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-flex;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700}
  .pill.green{background:rgba(46,204,113,.15);color:#2ECC71}
  .pill.red{background:rgba(232,57,46,.15);color:#E8392E}
  .pill.amber{background:rgba(245,166,35,.15);color:#F5A623}
  .pill.grey{background:rgba(154,147,144,.15);color:#9A9390}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:8px 12px;border-radius:8px;border:2px solid #333;background:#2D2D2D;color:#F2EDE8;font-size:13px}
  .action-btn{padding:5px 11px;border-radius:8px;border:1px solid #333;background:#242424;color:#F2EDE8;font-size:11px;cursor:pointer}
  .action-btn:hover{border-color:#E8392E;color:#E8392E}
  .empty{color:#9A9390;font-size:13px;padding:20px;text-align:center}
  .code-mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
  .match-row{background:#1C1C1C;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px}
  .match-row:hover{border-color:#E8392E}
  .match-row.selected{border-color:#E8392E;background:#241414}
  .match-row mark{background:rgba(245,166,35,.35);color:#F2EDE8;padding:0 2px;border-radius:3px}
  .code-textarea{width:100%;min-height:60vh;background:#111;color:#F2EDE8;border:1px solid #2a2a2a;border-radius:10px;padding:14px;font-size:12px;line-height:1.5;resize:vertical;outline:none}
  .code-textarea:focus{border-color:#E8392E}
  .warn-box{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.35);color:#F5A623;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Handa <span style="color:#E8392E">Admin</span></h1>
    <p>Sign in with an ADMIN-role account.</p>
    <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><div style="position:relative"><input id="login-password" type="password" autocomplete="current-password" style="padding-right:38px"><span onclick="togglePwVisibility('login-password',this)" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:16px;cursor:pointer;user-select:none;">👁️</span></div></div>
    <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app-screen" class="hidden">
  <nav>
    <div class="brand">Handa <span>Admin</span></div>
    <button class="nav-item" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="nav-item" data-tab="reports" data-elevated="1" onclick="switchTab('reports')">Reports</button>
    <button class="nav-item" data-tab="users" onclick="switchTab('users')">Users</button>
    <button class="nav-item" data-tab="vendors" onclick="switchTab('vendors')">Vendors</button>
    <button class="nav-item" data-tab="riders" data-elevated="1" onclick="switchTab('riders')">Riders</button>
    <button class="nav-item" data-tab="shoppers" data-elevated="1" onclick="switchTab('shoppers')">Shoppers</button>
    <button class="nav-item" data-tab="bookings" data-elevated="1" onclick="switchTab('bookings')">Bookings</button>
    <button class="nav-item" data-tab="commissions" data-elevated="1" onclick="switchTab('commissions')">Commissions</button>
    <button class="nav-item" data-tab="escrow" data-elevated="1" onclick="switchTab('escrow')">Escrow</button>
    <button class="nav-item" data-tab="ratings" data-elevated="1" onclick="switchTab('ratings')">Ratings</button>
    <button class="nav-item" data-tab="payments" data-elevated="1" onclick="switchTab('payments')">Payments</button>
    <button class="nav-item" data-tab="subscriptions" data-elevated="1" onclick="switchTab('subscriptions')">Subscriptions</button>
    <button class="nav-item" data-tab="tickets" onclick="switchTab('tickets')">Support Tickets</button>
    <button class="nav-item" data-tab="withdrawals" onclick="switchTab('withdrawals')">Withdrawals</button>
    <button class="nav-item" data-tab="shopsessions" data-elevated="1" onclick="switchTab('shopsessions')">Live Shop-For-Me</button>
    <button class="nav-item" data-tab="activecodes" data-elevated="1" onclick="switchTab('activecodes')">Active Codes</button>
    <button class="nav-item" data-tab="codeeditor" data-elevated="1" onclick="switchTab('codeeditor')">Code Editor</button>
    <button class="nav-item" data-tab="codes" data-elevated="1" onclick="switchTab('codes')">Codes</button>
    <button class="nav-item" data-tab="livepreview" data-elevated="1" onclick="switchTab('livepreview')">Live Preview</button>
    <button class="nav-item" data-tab="kyc" onclick="switchTab('kyc')">KYC Documents</button>
    <button class="nav-item" data-tab="appsettings" data-elevated="1" onclick="switchTab('appsettings')">App Settings</button>
    <button class="nav-item" data-tab="announcements" data-elevated="1" onclick="switchTab('announcements')">Announcements</button>
    <button class="nav-item" data-tab="bulkemail" data-elevated="1" onclick="switchTab('bulkemail')">Bulk Email</button>
    <button class="nav-item" data-tab="bulksms" data-elevated="1" onclick="switchTab('bulksms')">Bulk SMS</button>
    <button class="nav-item" data-tab="aiconversations" data-elevated="1" onclick="switchTab('aiconversations')">AI Conversations</button>
    <button class="nav-item" data-tab="chatthreads" data-elevated="1" onclick="switchTab('chatthreads')">Live Chat</button>
    <button class="nav-item" data-tab="admins" data-super="1" onclick="switchTab('admins')">Admins</button>
    <button class="nav-item" data-tab="auditlog" data-super="1" onclick="switchTab('auditlog')">Audit Log</button>
    <div class="spacer"></div>
    <div class="who"><b id="who-name"></b><span id="who-email"></span></div>
    <button class="logout" onclick="logout()">Sign out</button>
  </nav>
  <main id="main"></main>
</div>

<script>
const API = '/api';
let accessToken = null;
let currentUser = null;

function authHeaders() {
  return accessToken ? { 'Authorization': 'Bearer ' + accessToken } : {};
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(opts.headers || {}) },
    credentials: 'include',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}

function togglePwVisibility(id, btn) {
  const inp = document.getElementById(id);
  if (!inp) return;
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁️';
}
function money(kobo) { return '₦' + ((kobo || 0) / 100).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
// Compact multi-line Contact cell: email, phone, address — used everywhere
// a table row or detail card shows "who to reach and where", not just email.
function contactCell(email, phone, address) {
  const extra = [phone, address].filter(Boolean);
  return (email || '—') + (extra.length ? '<br><span style="color:#9A9390;font-size:11px">' + extra.join('<br>') + '</span>' : '');
}
function contactBreakdown(phone, address) {
  return [phone, address].filter(Boolean).join(' · ') || 'No phone/address on file';
}
const NG_STATES = ['Abia','Adamawa','Akwa Ibom','Anambra','Bauchi','Bayelsa','Benue','Borno','Cross River','Delta','Ebonyi','Edo','Ekiti','Enugu','FCT (Abuja)','Gombe','Imo','Jigawa','Kaduna','Kano','Katsina','Kebbi','Kogi','Kwara','Lagos','Nasarawa','Niger','Ogun','Ondo','Osun','Oyo','Plateau','Rivers','Sokoto','Taraba','Yobe','Zamfara'];
function stateFilterOptions(selected) { return '<option value="">All states</option>' + NG_STATES.map(s => '<option' + (selected === s ? ' selected' : '') + '>' + s + '</option>').join(''); }

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  err.textContent = '';
  if (!email || !password) { err.textContent = 'Email and password are required.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    if (data.user.role !== 'ADMIN') { throw new Error('This account is not an admin account.'); }
    accessToken = data.accessToken;
    currentUser = data.user;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('who-name').textContent = currentUser.name + (currentUser.isSuperAdmin ? ' (Super Admin)' : currentUser.isContentAdmin ? ' (Content Admin)' : '');
    document.getElementById('who-email').textContent = currentUser.email || currentUser.phone || '';
    document.querySelectorAll('.nav-item[data-super]').forEach(b => b.classList.toggle('hidden', !currentUser.isSuperAdmin));
    document.querySelectorAll('.nav-item[data-elevated]').forEach(b => b.classList.toggle('hidden', !(currentUser.isSuperAdmin || currentUser.isContentAdmin)));
    switchTab('dashboard');
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

function logout() {
  accessToken = null; currentUser = null;
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-password').value = '';
}

function switchTab(tab) {
  if (window._codesDirty && !confirm('You have unsaved edits in the Codes tab. Leave without saving?')) return;
  window._codesDirty = false;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const renderers = { dashboard: renderDashboard, reports: renderReports, users: renderUsers, vendors: renderVendors, riders: renderRiders, shoppers: renderShoppers, bookings: renderBookings, commissions: renderCommissions, escrow: renderEscrow, ratings: renderRatings, payments: renderPayments, subscriptions: renderSubscriptions, tickets: renderTickets, withdrawals: renderWithdrawals, shopsessions: renderShopSessions, activecodes: renderActiveCodes, codeeditor: renderCodeEditor, codes: renderCodes, livepreview: renderLivePreview, kyc: renderKycDocuments, appsettings: renderAppSettings, announcements: renderAnnouncements, bulkemail: renderBulkEmail, bulksms: renderBulkSms, aiconversations: renderAiConversations, chatthreads: renderChatThreads, admins: renderAdmins, auditlog: renderAuditLog };
  if (tab !== 'chatthreads') stopChatThreadAutoRefresh();
  renderers[tab]();
}

const STATUS_PILL = { ACTIVE: 'green', ONLINE: 'green', OPEN: 'red', PENDING: 'amber', PROCESSING: 'amber', SUSPENDED: 'red', DELETED: 'grey', RESOLVED: 'green', CLOSED: 'grey', IN_PROGRESS: 'amber', COMPLETED: 'green', FAILED: 'red', EXPIRED: 'grey' };
function pill(status) { return '<span class="pill ' + (STATUS_PILL[status] || 'grey') + '">' + status + '</span>'; }

async function renderDashboard() {
  const main = document.getElementById('main');
  main.innerHTML = '<h2>Dashboard</h2><div class="empty">Loading...</div>';
  try {
    const s = await api('/admin/dashboard');
    const roleRows = Object.entries(s.usersByRole).map(([k, v]) => k + ': ' + v).join('<br>');
    const bookingRows = Object.entries(s.bookingsByStatus).map(([k, v]) => k + ': ' + v).join('<br>') || 'No bookings yet';
    main.innerHTML =
      '<h2>Dashboard</h2>' +
      '<div class="grid">' +
        card('Users', Object.values(s.usersByRole).reduce((a, b) => a + b, 0), roleRows) +
        card('Bookings', Object.values(s.bookingsByStatus).reduce((a, b) => a + b, 0), bookingRows) +
        card('Gross Merchandise Value', money(s.grossMerchandiseValueKobo), 'Completed bookings + Shop-For-Me sessions') +
        card('Held in Escrow', money(s.heldEscrowKobo), 'Awaiting release') +
        card('Open Support Tickets', s.openTickets, '') +
        card('Pending Withdrawals', s.pendingWithdrawals, '') +
      '</div>';
  } catch (e) {
    main.innerHTML = '<h2>Dashboard</h2><div class="empty">' + e.message + '</div>';
  }
}
function card(label, value, breakdown) {
  return '<div class="card"><div class="label">' + label + '</div><div class="value">' + value + '</div>' + (breakdown ? '<div class="breakdown">' + breakdown + '</div>' : '') + '</div>';
}

function barRow(label, kobo, maxKobo) {
  const pct = maxKobo > 0 ? Math.max(2, Math.round((kobo / maxKobo) * 100)) : 0;
  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;">'
    + '<div style="width:110px;flex-shrink:0;color:#9A9390;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + label + '</div>'
    + '<div style="flex:1;background:#242424;border-radius:6px;overflow:hidden;height:18px;"><div style="width:' + pct + '%;background:#E8392E;height:100%;"></div></div>'
    + '<div style="width:90px;flex-shrink:0;text-align:right;font-weight:700;">' + money(kobo) + '</div>'
    + '</div>';
}

async function renderReports() {
  const main = document.getElementById('main');
  main.innerHTML = '<h2>Reports</h2><div class="empty">Loading...</div>';
  try {
    const r = await api('/admin/reports');

    const maxDay = Math.max(1, ...r.revenueByDay.map(d => d.revenueKobo));
    const revenueRows = r.revenueByDay.filter(d => d.revenueKobo > 0).slice(-14)
      .map(d => barRow(d.date, d.revenueKobo, maxDay)).join('') || '<div class="empty">No platform revenue released yet in the last 30 days.</div>';

    const maxCat = Math.max(1, ...r.gmvByCategory.map(c => c.gmvKobo));
    const categoryRows = r.gmvByCategory.filter(c => c.gmvKobo > 0)
      .map(c => barRow(c.category, c.gmvKobo, maxCat)).join('') || '<div class="empty">No completed GMV yet.</div>';

    const cs = r.commissionSummary;
    const commissionCards = ['PENDING', 'PAID', 'OVERDUE'].map(status => {
      const s = cs[status] || { dueKobo: 0, paidKobo: 0 };
      return card(status.charAt(0) + status.slice(1).toLowerCase() + ' Commission', money(s.dueKobo), 'Paid so far: ' + money(s.paidKobo));
    }).join('');

    const vendorRows = r.topVendors.map((v, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + v.bizName + '</td><td>' + v.vtype + '</td><td>' + money(v.revenueKobo) + '</td></tr>'
    ).join('');

    main.innerHTML = '<h2>Reports</h2>'
      + '<h3 style="margin-top:0">Platform Revenue — last 30 days</h3>'
      + '<div class="card" style="margin-bottom:20px">' + revenueRows + '</div>'
      + '<h3>GMV by Category</h3>'
      + '<div class="card" style="margin-bottom:20px">' + categoryRows + '</div>'
      + '<h3>Vendor Commission</h3>'
      + '<div class="grid" style="margin-bottom:20px">' + commissionCards + '</div>'
      + '<h3>Top Vendors by Revenue</h3>'
      + (r.topVendors.length
          ? '<table><thead><tr><th>#</th><th>Business</th><th>Type</th><th>Revenue</th></tr></thead><tbody>' + vendorRows + '</tbody></table>'
          : '<div class="empty">No vendor revenue yet.</div>');
  } catch (e) {
    main.innerHTML = '<h2>Reports</h2><div class="empty">' + e.message + '</div>';
  }
}

// Preserves the toolbar's current filter selections across re-renders —
// renderUsers() rebuilds the whole toolbar HTML from scratch every call,
// so without this the role/state <select>s used to visually reset to
// "All" after every Filter click even though the fetch itself used the
// value that was selected at click time.
let _usersFilter = { role: '', state: '', q: '', page: 1 };
async function renderUsers() {
  const main = document.getElementById('main');
  const roleEl = document.getElementById('user-role'), stateEl = document.getElementById('user-state'), qEl = document.getElementById('user-q');
  if (roleEl) _usersFilter.role = roleEl.value;
  if (stateEl) _usersFilter.state = stateEl.value;
  if (qEl) _usersFilter.q = qEl.value;
  const f = _usersFilter;
  const pageSize = 25;
  main.innerHTML =
    '<h2>Users</h2>' +
    '<div class="toolbar">' +
      '<input id="user-q" placeholder="Search name/email/phone" value="' + (f.q || '').replace(/"/g, '&quot;') + '" onkeydown="if(event.key===\'Enter\'){_usersFilter.page=1;renderUsers();}">' +
      '<select id="user-role" onchange="_usersFilter.page=1;renderUsers()"><option value="">All roles</option>' + ['CUSTOMER', 'VENDOR', 'RIDER', 'SHOPPER', 'ADMIN'].map(r => '<option' + (f.role === r ? ' selected' : '') + '>' + r + '</option>').join('') + '</select>' +
      '<select id="user-state" onchange="_usersFilter.page=1;renderUsers()">' + stateFilterOptions(f.state) + '</select>' +
      '<button class="action-btn" onclick="_usersFilter.page=1;renderUsers()">Filter</button>' +
    '</div>' +
    '<div id="users-table" class="empty">Loading...</div>';
  try {
    const params = new URLSearchParams({ ...(f.role && { role: f.role }), ...(f.state && { state: f.state }), ...(f.q && { q: f.q }), page: f.page, pageSize });
    const data = await api('/admin/users?' + params.toString());
    const rows = data.users.map(u => {
      const extra = u.vendorProfile ? u.vendorProfile.bizName + (u.vendorProfile.isVerified ? ' ✓' : '') : (u.riderProfile ? 'Rider' : (u.shopperProfile ? 'Shopper' : ''));
      let verifyBtn = '';
      if (u.riderProfile) {
        verifyBtn = '<button class="action-btn" onclick="setProfileVerified(\'rider\',\'' + u.riderProfile.id + '\',' + (!u.riderProfile.isVerified) + ')">' + (u.riderProfile.isVerified ? 'Unverify' : 'Verify') + '</button>';
      } else if (u.shopperProfile) {
        verifyBtn = '<button class="action-btn" onclick="setProfileVerified(\'shopper\',\'' + u.shopperProfile.id + '\',' + (!u.shopperProfile.isVerified) + ')">' + (u.shopperProfile.isVerified ? 'Unverify' : 'Verify') + '</button>';
      }
      const outreachBtns = u.phone
        ? ' <button class="action-btn" onclick="openSmsModal(\'' + u.id + '\',' + JSON.stringify(u.name) + ')">Message</button> <button class="action-btn" onclick="callUser(\'' + u.id + '\',' + JSON.stringify(u.name) + ')">Call</button>'
        : '';
      const viewBtn = '<button class="action-btn" onclick="renderCustomerDetail(\'' + u.id + '\')">View</button> ';
      return '<tr><td>' + u.name + '</td><td>' + contactCell(u.email, u.phone, u.address) + '</td><td>' + u.role + '</td><td>' + (u.state || '—') + '</td><td>' + extra + '</td><td>' + pill(u.status) + '</td>' +
        '<td>' + viewBtn + (u.status === 'ACTIVE'
          ? '<button class="action-btn" onclick="setUserStatus(\'' + u.id + '\',\'SUSPENDED\')">Suspend</button>'
          : '<button class="action-btn" onclick="setUserStatus(\'' + u.id + '\',\'ACTIVE\')">Activate</button>') + ' ' + verifyBtn + outreachBtns + '</td></tr>';
    }).join('');
    const totalPages = Math.max(1, Math.ceil(data.total / pageSize));
    const pager = '<div class="toolbar" style="margin-top:12px">'
      + '<button class="action-btn"' + (f.page <= 1 ? ' disabled' : '') + ' onclick="_usersFilter.page--;renderUsers()">&laquo; Prev</button>'

        : '';
      return '<tr><td>' + t.category + (t.isDispute ? ' <span class="pill amber">DISPUTE</span>' : '') + '</td><td>' + t.context + '</td><td>' + (t.user ? t.user.name : '—') + '</td><td>' + (t.description || '').slice(0, 60) + '<br><small>' + disputeInfo + '</small>' + secondSide + '</td>' +

async function ceSearch() {
  _ceFile = document.getElementById('ce-file').value;
  const query = document.getElementById('ce-query').value;
  const resultsEl = document.getElementById('ce-results');
  if (!query) { resultsEl.innerHTML = '<div class="empty">Type something to search for.</div>'; return; }
  resultsEl.innerHTML = '<div class="empty">Searching...</div>';
  try {
    const data = await api('/admin/files/search', { method: 'POST', body: JSON.stringify({ file: _ceFile, query, contextChars: 60 }) });
    _ceMatches = data.matches;
    _ceSelectedOccurrence = null;
    if (!data.matches.length) { resultsEl.innerHTML = '<div class="empty">No matches found.</div>'; document.getElementById('ce-replace-form').innerHTML = ''; return; }
    resultsEl.innerHTML = '<p style="color:#9A9390;font-size:12px;margin-bottom:8px">' + data.totalOccurrences + ' occurrence(s)' + (data.truncated ? ' (showing first ' + data.matches.length + ')' : '') + ' — click one to select it</p>' +
      data.matches.map(m =>
        '<div class="match-row code-mono" style="cursor:pointer" data-occ="' + m.occurrenceIndex + '" onclick="ceSelectMatch(' + m.occurrenceIndex + ')">#' + m.occurrenceIndex + '&nbsp; ' + escHtml(m.before) + '<mark>' + escHtml(m.match) + '</mark>' + escHtml(m.after) + '</div>'
      ).join('');
    document.getElementById('ce-replace-form').innerHTML = !currentUser.isSuperAdmin
      ? '<p class="warn-box">View only — only the Super Admin can save changes here.</p>'
      : '<div class="card" style="margin-top:14px">' +
      '<div class="field"><label>Find (must match the text above exactly)</label><input id="ce-find" class="code-mono" value="' + escHtml(query) + '" style="width:100%"></div>' +
      '<div class="field"><label>Replace with</label><textarea id="ce-replacewith" class="code-mono" style="width:100%;min-height:80px"></textarea></div>' +
      '<div class="toolbar">' +
        '<span id="ce-selected-note" style="color:#9A9390;font-size:12px"></span>' +
        '<label style="display:flex;align-items:center;gap:6px;color:#9A9390;font-size:12px"><input type="checkbox" id="ce-replaceall"> Replace all ' + data.totalOccurrences + ' occurrences</label>' +
        '<button class="btn" style="width:auto;padding:8px 16px" onclick="ceReplace()">Replace</button>' +
      '</div>' +
      '<div class="err" id="ce-replace-err"></div>' +
      '</div>';
  } catch (e) {
    resultsEl.innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

function ceSelectMatch(occurrenceIndex) {
  _ceSelectedOccurrence = occurrenceIndex;
  document.querySelectorAll('.match-row').forEach(r => r.classList.toggle('selected', parseInt(r.dataset.occ) === occurrenceIndex));
  const note = document.getElementById('ce-selected-note');
  const replaceAllEl = document.getElementById('ce-replaceall');
  if (note) note.textContent = 'Selected occurrence #' + occurrenceIndex;
  if (replaceAllEl) replaceAllEl.checked = false;
}

async function ceReplace() {
  const find = document.getElementById('ce-find').value;
  const replaceWith = document.getElementById('ce-replacewith').value;
  const replaceAll = document.getElementById('ce-replaceall').checked;
  const errEl = document.getElementById('ce-replace-err');
  errEl.textContent = '';
  if (!confirm('Replace ' + (replaceAll ? 'ALL' : (_ceSelectedOccurrence !== null ? 'occurrence #' + _ceSelectedOccurrence : 'this')) + ' occurrence(s) in ' + _ceFile + '? A backup will be taken first.')) return;
  try {
    const body = { file: _ceFile, find, replaceWith, replaceAll };
    if (!replaceAll && _ceSelectedOccurrence !== null) body.occurrenceIndex = _ceSelectedOccurrence;
    const data = await api('/admin/files/replace', { method: 'POST', body: JSON.stringify(body) });
    alert('Replaced ' + data.replacedCount + ' occurrence(s). Backup: ' + data.backupName);
    document.getElementById('ce-query').value = '';
    document.getElementById('ce-results').innerHTML = '';
    document.getElementById('ce-replace-form').innerHTML = '';
    _ceSelectedOccurrence = null;
    ceLoadBackups();
  } catch (e) {
    errEl.textContent = e.message + (e.occurrences ? ' (' + e.occurrences + ' matches — check "Replace all" or narrow your search text)' : '');
  }
}

async function ceLoadBackups() {
  const el = document.getElementById('ce-backups');
  if (!el) return;
  el.className = 'empty'; el.textContent = 'Loading...';
  try {
    const data = await api('/admin/files/backups?file=' + encodeURIComponent(_ceFile));
    if (!data.backups.length) { el.className = 'empty'; el.textContent = 'No backups yet for this file.'; return; }
    el.outerHTML = '<table><thead><tr><th>Backup</th><th>Size</th><th>Created</th><th></th></tr></thead><tbody>' +
      data.backups.map(b =>
        '<tr><td class="code-mono" style="font-size:11px">' + b.name + '</td><td>' + Math.round(b.sizeBytes / 1024) + ' KB</td><td>' + new Date(b.createdAt).toLocaleString() + '</td>' +
        '<td>' + (currentUser.isSuperAdmin ? '<button class="action-btn" onclick="ceRestore(\'' + b.name + '\')">Restore</button>' : '') + '</td></tr>'
      ).join('') + '</tbody></table>';
  } catch (e) {
    el.className = 'empty'; el.textContent = e.message;
  }
}

async function ceRestore(backupName) {
  if (!confirm('Restore ' + _ceFile + ' from ' + backupName + '? The current live version will itself be backed up first.')) return;
  try {
    await api('/admin/files/restore', { method: 'POST', body: JSON.stringify({ file: _ceFile, backupName }) });
    alert('Restored.');
    ceLoadBackups();
  } catch (e) {
    alert(e.message);
  }
}

let _codesFile = 'app/index.html';
let _codesOriginalLength = 0;

// Raw fetches here bypass api() (which forces JSON), so they need their
// own timeout — a stalled request otherwise hangs the Load/Save button
// forever with no feedback.
async function fetchWithTimeout(url, opts, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 45000);
  try {
    return await fetch(url, { ...opts, signal: controller.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Request timed out — the server took too long to respond.');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function renderCodes() {
  const main = document.getElementById('main');
  const canSave = currentUser.isSuperAdmin;
  window._codesDirty = false;
  main.innerHTML =
    '<h2>Codes</h2>' +
    '<p style="color:#9A9390;margin:-8px 0 16px">Load a live frontend file\'s full raw source, edit it, and save. A backup is taken before every save, and the save is rejected if the new content fails a script syntax check.</p>' +
    (canSave ? '' : '<p class="warn-box">View only — only the Super Admin can save changes to live code.</p>') +
    '<div class="toolbar">' +
      '<select id="codes-file">' + ceFileOptions() + '</select>' +
      '<button class="action-btn" onclick="codesLoad()">Load</button>' +
      '<button class="action-btn" onclick="codesReload()">Reload</button>' +
      '<input id="codes-find" placeholder="Find in loaded text (case-insensitive)..." style="min-width:200px" onkeydown="if(event.key===\'Enter\')codesFind()">' +
      '<button class="action-btn" onclick="codesFind()">Find next</button>' +
      (canSave ? '<button class="btn" style="width:auto;padding:8px 16px" onclick="codesSave()">Save</button>' : '') +
    '</div>' +
    '<div class="err" id="codes-err"></div>' +
    '<textarea id="codes-textarea" class="code-textarea code-mono" ' + (canSave ? '' : 'readonly') + ' placeholder="Click Load to fetch the file&#39;s current contents..." oninput="window._codesDirty=true"></textarea>';
  document.getElementById('codes-file').value = _codesFile;
  document.getElementById('codes-file').addEventListener('change', function (e) {
    if (window._codesDirty && !confirm('You have unsaved edits. Discard them and switch files?')) { e.target.value = _codesFile; return; }
    _codesFile = e.target.value;
    window._codesDirty = false;
    codesLoad();
  });
}

async function codesLoad() {
  _codesFile = document.getElementById('codes-file').value;
  const ta = document.getElementById('codes-textarea');
  const errEl = document.getElementById('codes-err');
  errEl.textContent = '';
  ta.value = 'Loading...';
  try {
    const res = await fetchWithTimeout(API + '/admin/files/content?file=' + encodeURIComponent(_codesFile), { headers: authHeaders() });
    if (!res.ok) throw new Error('Failed to load (' + res.status + ')');
    const text = await res.text();
    ta.value = text;
    _codesOriginalLength = text.length;
    window._codesDirty = false;
  } catch (e) {
    ta.value = '';
    errEl.textContent = e.message;
  }
}

function codesReload() {
  if (window._codesDirty && !confirm('Discard your unsaved edits and reload ' + _codesFile + ' from the server?')) return;
  codesLoad();
}

let _codesFindFrom = 0;
function codesFind() {
  const ta = document.getElementById('codes-textarea');
  const q = document.getElementById('codes-find').value;
  if (!q) return;
  const hay = ta.value.toLowerCase();
  const needle = q.toLowerCase();
  let idx = hay.indexOf(needle, _codesFindFrom);
  let wrapped = false;
  if (idx === -1) { idx = hay.indexOf(needle, 0); wrapped = true; }
  if (idx === -1) { alert('Not found.'); _codesFindFrom = 0; return; }
  ta.focus();
  ta.setSelectionRange(idx, idx + q.length);
  const lineHeight = parseFloat(getComputedStyle(ta).lineHeight) || 18;
  const linesBefore = ta.value.slice(0, idx).split('\n').length;
  ta.scrollTop = Math.max(0, (linesBefore - 5) * lineHeight);
  _codesFindFrom = idx + q.length;
  if (wrapped) {
    const errEl = document.getElementById('codes-err');
    if (errEl) { errEl.style.color = '#9A9390'; errEl.textContent = 'Wrapped to top of file.'; setTimeout(() => { if (errEl.textContent === 'Wrapped to top of file.') errEl.textContent = ''; }, 2500); }
  }
}

async function codesSave(confirmDrasticShrink) {
  const ta = document.getElementById('codes-textarea');
  const errEl = document.getElementById('codes-err');
  errEl.style.color = '';
  errEl.textContent = '';
  const content = ta.value;
  if (!content) { errEl.textContent = 'Nothing loaded — click Load first.'; return; }
  if (!confirm('Save changes to ' + _codesFile + '? A backup of the current live version will be taken first.')) return;
  try {
    const url = API + '/admin/files/save?file=' + encodeURIComponent(_codesFile) + (confirmDrasticShrink ? '&confirmDrasticShrink=true' : '');
    const res = await fetchWithTimeout(url, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'text/plain' }, body: content });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 409 && data.newSizeBytes !== undefined) {
        if (confirm('New content is ' + Math.round(data.newSizeBytes / 1024) + 'KB vs current ' + Math.round(data.currentSizeBytes / 1024) + 'KB — more than half smaller. This often means content was lost. Save anyway?')) {
          return codesSave(true);
        }
        return;
      }
      throw new Error(data.error || ('Save failed (' + res.status + ')'));
    }
    alert('Saved. Backup: ' + data.backupName);
    _codesOriginalLength = content.length;
    window._codesDirty = false;
  } catch (e) {
    errEl.textContent = e.message;
  }
}

// checked visually right after a Code Editor / Codes edit, without leaving

// embedded page's own eGo() directly through contentWindow. ──
function livePreviewFileOptions() {

async function renderLivePreview() {
  const main = document.getElementById('main');
  const file = document.getElementById('lp-file') ? document.getElementById('lp-file').value : 'app-dev/index.html';
  const jumpTargets = FEATURE_INDEX.filter(f => f.screen);
  main.innerHTML =
    '<h2>Live Preview</h2>' +
    '<p style="color:#9A9390;margin:-8px 0 16px">Embeds the real page so you can check a change visually. Use the -dev files to preview edits made in the Code Editor / Codes tools before touching the live file.</p>' +
    '<div class="toolbar">' +
      '<select id="lp-file" onchange="renderLivePreview()">' + livePreviewFileOptions() + '</select>' +
      '<select id="lp-jump"><option value="">Jump to screen…</option>' + jumpTargets.map(f => '<option value="' + f.screen + '">' + f.label + '</option>').join('') + '</select>' +
      '<button class="action-btn" onclick="lpJump()">Go</button>' +
      '<button class="action-btn" onclick="lpReload()">Reload</button>' +
    '</div>' +
    '<iframe id="lp-frame" src="/' + file + '" style="width:100%;height:75vh;border:1px solid #2a2a2a;border-radius:10px;background:#111"></iframe>';
  document.getElementById('lp-file').value = file;
}
function lpJump() {
  const screen = document.getElementById('lp-jump').value;
  if (!screen) return;
  const frame = document.getElementById('lp-frame');
  try {
    if (frame.contentWindow && typeof frame.contentWindow.eGo === 'function') frame.contentWindow.eGo(screen);
    else alert('Preview page hasn\'t finished loading yet, or has no eGo() (this may be the admin panel itself, which uses switchTab instead).');
  } catch (e) {
    alert('Could not jump: ' + e.message);
  }
}
function lpReload() {
  const frame = document.getElementById('lp-frame');
  if (frame) frame.src = frame.src;
}

  const days = prompt('Extend by how many days from today?', '30');

  try { await api('/admin/subscriptions/' + id, { method: 'PATCH', body: JSON.stringify({ endAt: newEndAt }) }); renderSubscriptions(); }
  catch (e) { alert(e.message); }
}

async function saveAppSetting() {
  const key = document.getElementById('as-key').value.trim();
  const rawValue = document.getElementById('as-value').value;
  const category = document.getElementById('as-category').value.trim();
  const errEl = document.getElementById('as-err');
  errEl.textContent = '';
  if (!key) { errEl.textContent = 'Key is required.'; return; }
  let value;
  try { value = JSON.parse(rawValue); } catch (e) { value = rawValue; } // plain strings don't need quoting
  try {
    await api('/admin/app-settings/' + encodeURIComponent(key), { method: 'PUT', body: JSON.stringify({ value, category: category || undefined }) });
    document.getElementById('app-setting-form').innerHTML = '';
    renderAppSettings();
  } catch (e) {
    errEl.textContent = e.message;
  }
}
async function deleteAppSetting(key) {
  if (!confirm('Delete setting "' + key + '"?')) return;
  try { await api('/admin/app-settings/' + encodeURIComponent(key), { method: 'DELETE' }); renderAppSettings(); }
  catch (e) { alert(e.message); }
}

// Only touches the messages pane, never the reply input/attach controls --
// the 8s auto-refresh used to rebuild the whole panel every tick, wiping
// out whatever the admin was mid-typing in the reply box.
async function loadChatThreadDetail(id) {
  const msgsEl = document.getElementById('chat-thread-msgs');
  if (!msgsEl) return;
  try {
    const data = await api('/admin/chat-threads/' + id + '/messages');
    const bubbles = data.messages.map(m => {
      const mine = m.sender.role === 'ADMIN';
      const img = m.attachmentUrl ? ('<a href="' + m.attachmentUrl + '" target="_blank"><img src="' + m.attachmentUrl + '" style="max-width:160px;max-height:160px;border-radius:8px;display:block;' + (m.body ? 'margin-bottom:6px;' : '') + '"></a>') : '';
      return '<div style="max-width:70%;margin-bottom:8px;' + (mine ? 'margin-left:auto;text-align:right;' : '') + '">' +
        '<div style="font-size:11px;color:#9A9390;margin-bottom:2px;">' + escHtml(m.sender.name) + '</div>' +
        '<div style="display:inline-block;padding:9px 12px;border-radius:10px;text-align:left;background:' + (mine ? '#2ECC71' : '#242424') + ';color:' + (mine ? '#111' : '#F2EDE8') + ';font-size:13px;">' + img + (m.body ? escHtml(m.body) : '') + '</div></div>';
    }).join('');

  } catch (e) {
    msgsEl.textContent = e.message;
  }

// Real evidence/proof upload for the admin's side of a dispute
// conversation — mirrors the customer app's sendChatAttachment.
async function sendChatThreadAttachment(id, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  try {
    const fd = new FormData();
    fd.append('file', file);
    const upRes = await fetch(API + '/admin/chat-threads/' + id + '/attachment', {
      method: 'POST', headers: authHeaders(), body: fd,
    });
    const upData = await upRes.json().catch(() => ({}));
    if (!upRes.ok) throw new Error(upData.error || 'Could not upload the photo');
    await api('/admin/chat-threads/' + id + '/messages', { method: 'POST', body: JSON.stringify({ attachmentUrl: upData.url }) });
    await loadChatThreadDetail(id);
  } catch (e) {
    alert(e.message);
  } finally {
    inputEl.value = '';
  }
}

      '<div style="display:flex;align-items:center;gap:8px;padding:6px 0">' +
      '<span style="width:10px;height:10px;border-radius:50%;flex-shrink:0;background:' + (i <= stageIdx && stageIdx >= 0 ? '#2ECC71' : '#333') + '"></span>' +
      '<span style="font-size:13px;color:' + (i <= stageIdx && stageIdx >= 0 ? '#F2EDE8' : '#9A9390') + '">' + stage.replace(/_/g, ' ') + '</span></div>'
    ).join('');
    const items = (s.items || []).map(it =>
      '<tr><td>' + it.text + '</td><td>' + (it.priceKobo != null ? money(it.priceKobo) : '—') + '</td><td>' + (it.approved ? pill('ACTIVE') : pill('PENDING')) + '</td></tr>'
    ).join('');
    const escrow = (s.escrowHolds || []).map(h =>
      '<tr><td>' + h.payeeRole + '</td><td>' + money(h.amountKobo) + '</td><td>' + pill(h.status) + '</td></tr>'
    ).join('');
    main.innerHTML =
      '<button class="action-btn" style="margin-bottom:14px" onclick="switchTab(\'shopsessions\')">&larr; Back to list</button>' +
      '<h2>Session ' + s.id.slice(0, 8) + '</h2>' +
      '<div class="grid">' +
        card('Customer', s.customer ? s.customer.name : '—', s.customer ? s.customer.phone : '') +
        card('Shopper', s.shopper && s.shopper.user ? s.shopper.user.name : 'Not matched', '') +
        card('Rider', s.rider && s.rider.user ? s.rider.user.name : 'Not assigned', '') +
        card('Status', s.status.replace(/_/g, ' '), '') +
      '</div>' +
      '<h2>Timeline</h2><div class="card" style="margin-bottom:24px">' + stageFlow + '</div>' +
      '<h2>Items</h2>' + (items ? '<table><thead><tr><th>Item</th><th>Price</th><th>Approved</th></tr></thead><tbody>' + items + '</tbody></table>' : '<div class="empty">No items.</div>') +
      '<h2 style="margin-top:24px">Escrow Holds</h2>' + (escrow ? '<table><thead><tr><th>Payee</th><th>Amount</th><th>Status</th></tr></thead><tbody>' + escrow + '</tbody></table>' : '<div class="empty">No escrow holds.</div>');
  } catch (e) {
    main.innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

document.getElementById('login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
