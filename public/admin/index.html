<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handa Admin</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'DM Sans',Segoe UI,Arial,sans-serif;background:#111;color:#F2EDE8;min-height:100vh}
  a{color:inherit}
  .hidden{display:none !important}
  /* ── Login screen ── */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{width:100%;max-width:360px;background:#1C1C1C;border:1px solid #2a2a2a;border-radius:16px;padding:28px}
  .login-box h1{font-size:20px;margin-bottom:4px}
  .login-box p{color:#9A9390;font-size:13px;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#9A9390;margin-bottom:6px}
  .field input{width:100%;padding:11px 13px;border-radius:10px;border:2px solid #333;background:#2D2D2D;color:#F2EDE8;font-size:14px;outline:none}
  .field input:focus{border-color:#E8392E}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:10px;border:none;background:#E8392E;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .err{color:#E8392E;font-size:13px;margin-top:10px;min-height:16px}
  /* ── App shell ── */
  #app-screen{display:flex;min-height:100vh}
  nav{width:220px;flex-shrink:0;background:#1C1C1C;border-right:1px solid #2a2a2a;padding:20px 0;display:flex;flex-direction:column}
  nav .brand{padding:0 20px 20px;font-weight:800;font-size:18px}
  nav .brand span{color:#E8392E}
  nav button.nav-item{display:block;width:100%;text-align:left;padding:12px 20px;background:none;border:none;color:#9A9390;font-size:14px;font-weight:600;cursor:pointer;border-left:3px solid transparent}
  nav button.nav-item.on{color:#F2EDE8;border-left-color:#E8392E;background:rgba(232,57,46,.08)}
  nav .spacer{flex:1}
  nav .who{padding:14px 20px;font-size:12px;color:#9A9390;border-top:1px solid #2a2a2a}
  nav .who b{color:#F2EDE8;display:block;font-size:13px}
  nav button.logout{margin:8px 20px 0;padding:8px;border-radius:8px;border:1px solid #333;background:transparent;color:#9A9390;font-size:12px;cursor:pointer}
  main{flex:1;padding:28px 32px;overflow-x:auto}
  main h2{font-size:20px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
  .card{background:#1C1C1C;border:1px solid #2a2a2a;border-radius:14px;padding:16px}
  .card .label{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#9A9390;margin-bottom:8px}
  .card .value{font-size:24px;font-weight:800}
  .card .breakdown{margin-top:10px;font-size:12px;color:#9A9390;display:flex;flex-direction:column;gap:3px}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#1C1C1C;border:1px solid #2a2a2a;border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #2a2a2a}
  th{color:#9A9390;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-flex;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700}
  .pill.green{background:rgba(46,204,113,.15);color:#2ECC71}
  .pill.red{background:rgba(232,57,46,.15);color:#E8392E}
  .pill.amber{background:rgba(245,166,35,.15);color:#F5A623}
  .pill.grey{background:rgba(154,147,144,.15);color:#9A9390}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:8px 12px;border-radius:8px;border:2px solid #333;background:#2D2D2D;color:#F2EDE8;font-size:13px}
  .action-btn{padding:5px 11px;border-radius:8px;border:1px solid #333;background:#242424;color:#F2EDE8;font-size:11px;cursor:pointer}
  .action-btn:hover{border-color:#E8392E;color:#E8392E}
  .empty{color:#9A9390;font-size:13px;padding:20px;text-align:center}
  .code-mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
  .match-row{background:#1C1C1C;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px}
  .match-row:hover{border-color:#E8392E}
  .match-row.selected{border-color:#E8392E;background:#241414}
  .match-row mark{background:rgba(245,166,35,.35);color:#F2EDE8;padding:0 2px;border-radius:3px}
  .code-textarea{width:100%;min-height:60vh;background:#111;color:#F2EDE8;border:1px solid #2a2a2a;border-radius:10px;padding:14px;font-size:12px;line-height:1.5;resize:vertical;outline:none}
  .code-textarea:focus{border-color:#E8392E}
  .warn-box{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.35);color:#F5A623;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Handa <span style="color:#E8392E">Admin</span></h1>
    <p>Sign in with an ADMIN-role account.</p>
    <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><div style="position:relative"><input id="login-password" type="password" autocomplete="current-password" style="padding-right:38px"><span onclick="togglePwVisibility('login-password',this)" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:16px;cursor:pointer;user-select:none;">👁️</span></div></div>
    <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

    <button class="nav-item" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</button>

    <button class="nav-item" data-tab="commissions" data-elevated="1" onclick="switchTab('commissions')">Commissions</button>
    <button class="nav-item" data-tab="escrow" data-elevated="1" onclick="switchTab('escrow')">Escrow</button>
    <button class="nav-item" data-tab="ratings" data-elevated="1" onclick="switchTab('ratings')">Ratings</button>

    <button class="nav-item" data-tab="codeeditor" data-elevated="1" onclick="switchTab('codeeditor')">Code Editor</button>
    <button class="nav-item" data-tab="codes" data-elevated="1" onclick="switchTab('codes')">Codes</button>
    <button class="nav-item" data-tab="livepreview" data-elevated="1" onclick="switchTab('livepreview')">Live Preview</button>
    <button class="nav-item" data-tab="kyc" onclick="switchTab('kyc')">KYC Documents</button>
    <button class="nav-item" data-tab="appsettings" data-elevated="1" onclick="switchTab('appsettings')">App Settings</button>
    <button class="nav-item" data-tab="announcements" data-elevated="1" onclick="switchTab('announcements')">Announcements</button>
    <button class="nav-item" data-tab="bulkemail" data-elevated="1" onclick="switchTab('bulkemail')">Bulk Email</button>
    <button class="nav-item" data-tab="bulksms" data-elevated="1" onclick="switchTab('bulksms')">Bulk SMS</button>
    <button class="nav-item" data-tab="aiconversations" data-elevated="1" onclick="switchTab('aiconversations')">AI Conversations</button>
    <button class="nav-item" data-tab="chatthreads" data-elevated="1" onclick="switchTab('chatthreads')">Live Chat <span id="chat-notif-badge" style="display:none;background:#E8392E;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:4px;">0</span></button>
    <button class="nav-item" data-tab="admins" data-super="1" onclick="switchTab('admins')">Admins</button>
    <button class="nav-item" data-tab="auditlog" data-super="1" onclick="switchTab('auditlog')">Audit Log</button>
    <div class="spacer"></div>
    <div class="who"><b id="who-name"></b><span id="who-email"></span></div>
    <button class="logout" onclick="logout()">Sign out</button>
  </nav>
  <main id="main"></main>
</div>

<button id="admin-notif-bell" onclick="openAdminNotificationsModal()" style="display:none;position:fixed;top:16px;right:16px;z-index:1005;width:42px;height:42px;border-radius:50%;background:#1C1C1C;border:1.5px solid #2a2a2a;color:#F2EDE8;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);">
  🔔<span id="admin-notif-badge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:#E8392E;color:#fff;font-size:10px;font-weight:800;align-items:center;justify-content:center;padding:0 4px;line-height:17px;">0</span>
</button>

<div id="admin-toast" style="display:none;position:fixed;top:16px;right:16px;z-index:99999;background:#1C1C1C;color:#F2EDE8;border:1.5px solid #3B9FE8;border-radius:12px;padding:12px 16px;max-width:320px;font-family:inherit;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer;"></div>

<div id="admin-call-ov" style="display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.72);align-items:center;justify-content:center;font-family:inherit;">
  <div id="admin-call-body" style="background:#1C1C1C;border:1.5px solid #2a2a2a;border-radius:16px;padding:28px 24px;width:280px;text-align:center;"></div>
  <audio id="admin-call-remote-audio" autoplay></audio>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = '/api';
let accessToken = null;
let currentUser = null;

// ── Live Chat notifications — a real Socket.IO connection (this admin
// panel previously had none at all; every other tab is load-on-click/
// polling). Any CONTENT_ADMIN/SUPER_ADMIN socket auto-joins the shared
// "admins" room (see live.js) and gets a real push the moment the AI
// replies to a user — not just when the user's own message lands — so an
// admin watching this panel can see what the AI is saying and decide to
// jump into the conversation, without needing to already have that
// specific thread open. ──
let adminChatSocket = null;
let chatUnreadCount = 0;
// General-purpose admin notifications (KYC submitted, dispute opened,
// manual bank transfer awaiting confirmation, SOS) -- the exact same
// Notification/notify() system the customer/vendor app already has a real
// bell for; this admin panel had zero UI for it. Every admin (not just
// super/content tiers, unlike the chat-specific listeners below) gets
// these, since every admin can act on KYC/Tickets/Manual Bank Transfers.
let sysNotifUnread = 0;
function connectAdminNotifSocket() {
  if (adminChatSocket || typeof io === 'undefined' || !accessToken) return;
  adminChatSocket = io({ path: '/socket.io', auth: { token: accessToken }, transports: ['websocket', 'polling'] });
  adminChatSocket.on('chat:ai-replied', (p) => {
    bumpChatBadge();
    showAdminToast('🤖 AI replied to ' + (p.userName || 'a user') + ': "' + (p.preview || '').slice(0, 90) + '"', p.threadId);
  });
  adminChatSocket.on('chat:new-message-for-admins', () => {
    bumpChatBadge();
  });
  adminChatSocket.on('notification:new', (n) => {
    bumpSysNotifBadge();
    showAdminToast(n.title + ': ' + n.body, null, () => { document.getElementById('admin-toast').style.display = 'none'; openAdminNotificationsModal(); });
  });
  adminCallBindListeners();
}

// ── Real in-app voice call FROM a customer's "Chat with Support" button
// TO whichever admin picks it up first. There's no single fixed admin
// user to ring, so the backend (live.js) broadcasts the invite to every
// online super/content admin's socket (the shared "admins" room every
// such socket already auto-joins on connect) instead of one specific
// user:{id} room the way a normal 1:1 booking call works. Reuses the
// SAME bookingcall:offer/answer/ice-candidate/end relay the customer
// app's own booking-call system already uses for the actual SDP/ICE
// exchange once a call is answered -- only the invite/accept/claim layer
// (supportcall:*) is new, since a broadcast-then-first-to-answer flow
// has no equivalent in the 1:1 system. ──
let _adminCall = null; // {fromSocketId, fromUserId, callerName, callerAvatar, pc, localStream, status, micMuted, startedAt}
let _adminIceServersCache = null;
async function adminFetchIceServers() {
  if (_adminIceServersCache) return _adminIceServersCache;
  try {
    const res = await api('/config/ice-servers');
    _adminIceServersCache = (res && res.iceServers) || [{ urls: 'stun:stun.l.google.com:19302' }];
  } catch (e) {
    _adminIceServersCache = [{ urls: 'stun:stun.l.google.com:19302' }];
  }
  return _adminIceServersCache;
}
function adminCallBindListeners() {
  if (!adminChatSocket || adminChatSocket._callBound) return;
  adminChatSocket._callBound = true;
  adminChatSocket.on('supportcall:incoming', (p) => {
    if (!p) return;
    // A second admin already answering this exact call (by fromSocketId)
    // is handled by supportcall:claimed below, not here -- this just
    // shows the ringing UI for a genuinely new call.
    if (_adminCall) return; // this admin is already on/ringing a call
    _adminCall = { fromSocketId: p.fromSocketId, fromUserId: p.fromUserId, callerName: p.callerName || 'A customer', callerAvatar: p.callerAvatar || '👤', pc: null, localStream: null, status: 'incoming', micMuted: false, startedAt: null };
    renderAdminCallOverlay();
  });
  adminChatSocket.on('supportcall:claimed', (p) => {
    // Another admin got to it first -- clear OUR ringing UI for this same
    // call (never touch it if we're not even showing this one, or if
    // WE'RE the one who claimed it -- our own status is already past
    // 'incoming' by the time our own accept round-trips back here).
    if (_adminCall && _adminCall.status === 'incoming' && _adminCall.fromSocketId === (p && p.fromSocketId)) {
      _adminCall = null;
      renderAdminCallOverlay();
    }
  });
  adminChatSocket.on('supportcall:cancelled', (p) => {
    if (_adminCall && _adminCall.status === 'incoming' && _adminCall.fromSocketId === (p && p.fromSocketId)) {
      _adminCall = null;
      renderAdminCallOverlay();
    }
  });
  adminChatSocket.on('bookingcall:offer', (p) => {
    const c = _adminCall;
    if (!c || !c.pc || p.fromSocketId !== c.fromSocketId) return;
    c.pc.setRemoteDescription(new RTCSessionDescription(p.sdp)).then(() => c.pc.createAnswer()).then((answer) => c.pc.setLocalDescription(answer).then(() => {
      adminChatSocket.emit('bookingcall:answer', { toSocketId: p.fromSocketId, sdp: answer });
    })).catch(() => {});
  });
  adminChatSocket.on('bookingcall:ice-candidate', (p) => {
    const c = _adminCall;
    if (!c || !c.pc || p.fromSocketId !== c.fromSocketId || !p.candidate) return;
    c.pc.addIceCandidate(new RTCIceCandidate(p.candidate)).catch(() => {});
  });
  adminChatSocket.on('bookingcall:ended', () => {
    if (!_adminCall) return;
    showAdminToast('Call ended', null, () => { document.getElementById('admin-toast').style.display = 'none'; });
    adminCallTeardown();
  });
}
async function adminCallAccept() {
  const c = _adminCall;
  if (!c || c.status !== 'incoming') return;
  c.status = 'connecting';
  renderAdminCallOverlay();
  try {
    c.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    c.localStream = null;
  }
  const iceServers = await adminFetchIceServers();
  if (_adminCall !== c) return; // ended while awaiting mic/ICE config
  const pc = new RTCPeerConnection({ iceServers });
  c.pc = pc;
  if (c.localStream) {
    c.localStream.getTracks().forEach((t) => pc.addTrack(t, c.localStream));
  } else {
    pc.addTransceiver('audio', { direction: 'recvonly' });
    showAdminToast('Mic unavailable — you can still listen', null, () => { document.getElementById('admin-toast').style.display = 'none'; });
  }
  pc.onicecandidate = (ev) => {
    if (ev.candidate && adminChatSocket) adminChatSocket.emit('bookingcall:ice-candidate', { toSocketId: c.fromSocketId, candidate: ev.candidate });
  };
  pc.ontrack = (ev) => {
    const el = document.getElementById('admin-call-remote-audio');
    if (el) el.srcObject = ev.streams[0];
  };
  pc.onconnectionstatechange = () => {
    if (_adminCall !== c) return;
    if (pc.connectionState === 'connected' && c.status !== 'connected') {
      c.status = 'connected'; c.startedAt = Date.now();
      renderAdminCallOverlay();
      clearInterval(window._adminCallTickTimer);
      window._adminCallTickTimer = setInterval(() => { if (_adminCall && _adminCall.status === 'connected') renderAdminCallOverlay(); }, 1000);
    } else if (pc.connectionState === 'failed') {
      showAdminToast('Call connection lost', null, () => { document.getElementById('admin-toast').style.display = 'none'; });
      adminCallTeardown();
    }
  };
  adminChatSocket.emit('supportcall:accept', { toSocketId: c.fromSocketId });
}
function adminCallDismiss() {
  // Just hides OUR ringing UI -- doesn't tell the backend anything, since
  // another admin may still legitimately answer this same broadcast call.
  _adminCall = null;
  renderAdminCallOverlay();
}
function adminCallToggleMic() {
  const c = _adminCall; if (!c || !c.localStream) return;
  const t = c.localStream.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; c.micMuted = !t.enabled;
  renderAdminCallOverlay();
}
function adminCallEnd() {
  const c = _adminCall;
  if (c && adminChatSocket) adminChatSocket.emit('bookingcall:end', { toSocketId: c.fromSocketId });
  adminCallTeardown();
}
function adminCallTeardown() {
  clearInterval(window._adminCallTickTimer);
  const c = _adminCall;
  if (c) {
    if (c.pc) { try { c.pc.close(); } catch (e) {} }
    if (c.localStream) c.localStream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} });
  }
  _adminCall = null;
  const el = document.getElementById('admin-call-remote-audio'); if (el) el.srcObject = null;
  renderAdminCallOverlay();
}
function adminCallFmtDuration(ms) {
  const s = Math.floor(ms / 1000); const m = Math.floor(s / 60);
  return (m < 10 ? '0' : '') + m + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60);
}
function renderAdminCallOverlay() {
  const ov = document.getElementById('admin-call-ov'); const body = document.getElementById('admin-call-body');
  if (!ov || !body) return;
  const c = _adminCall;
  if (!c) { ov.style.display = 'none'; body.innerHTML = ''; return; }
  ov.style.display = 'flex';
  if (c.status === 'incoming') {
    body.innerHTML = `<div style="width:72px;height:72px;border-radius:50%;background:#242424;border:2px solid #2ECC71;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;">${c.callerAvatar}</div>`
      + `<div style="font-weight:800;font-size:17px;color:#F2EDE8;">${c.callerName}</div>`
      + `<div style="font-size:12px;color:#9A9390;margin-top:4px;">Incoming support call</div>`
      + `<div style="display:flex;gap:14px;margin-top:26px;justify-content:center;">`
      + `<button onclick="adminCallDismiss()" style="width:52px;height:52px;border-radius:50%;border:none;background:#3a3a3a;color:#fff;font-size:20px;cursor:pointer;">✕</button>`
      + `<button onclick="adminCallAccept()" style="width:52px;height:52px;border-radius:50%;border:none;background:#2ECC71;color:#111;font-size:20px;cursor:pointer;">📞</button>`
      + `</div>`
      + `<div style="display:flex;gap:14px;margin-top:8px;justify-content:center;font-size:10px;color:#9A9390;"><div style="width:52px;">Dismiss</div><div style="width:52px;">Answer</div></div>`;
    return;
  }
  const statusText = c.status === 'connecting' ? 'Connecting…' : adminCallFmtDuration(Date.now() - (c.startedAt || Date.now()));
  body.innerHTML = `<div style="width:72px;height:72px;border-radius:50%;background:#242424;border:2px solid #3B9FE8;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;">${c.callerAvatar}</div>`
    + `<div style="font-weight:800;font-size:17px;color:#F2EDE8;">${c.callerName}</div>`
    + `<div style="font-size:12px;color:#9A9390;margin-top:4px;">${statusText}</div>`
    + `<div style="display:flex;gap:12px;margin-top:26px;justify-content:center;">`
    + `<button onclick="adminCallToggleMic()" style="width:46px;height:46px;border-radius:50%;border:1.5px solid #2a2a2a;background:${c.micMuted ? '#E8392E' : '#242424'};color:#F2EDE8;font-size:17px;cursor:pointer;">🎤</button>`
    + `<button onclick="adminCallEnd()" style="width:52px;height:52px;border-radius:50%;border:none;background:#E8392E;color:#fff;font-size:20px;cursor:pointer;">📞</button>`
    + `</div>`;
}
function setSysNotifBadge(n) {
  sysNotifUnread = Math.max(0, n);
  const el = document.getElementById('admin-notif-badge');
  if (!el) return;

// Every tab switch and every "click an item to see its detail" view (renderVendorDetail,
// renderChatThreadDetail, etc.) replaces #main's innerHTML -- there are 50+ call sites for
// that, so rather than add a scroll-reset to each one individually, watch #main itself and
// snap the page back to the top whenever its content changes.
(function () {
  const mainEl = document.getElementById('main');
  if (!mainEl) return;
  const observer = new MutationObserver(() => {
    window.scrollTo(0, 0);
    mainEl.scrollTop = 0;
  });
  observer.observe(mainEl, { childList: true });
})();

// Every uploaded-file link in this panel (KYC doc, dispute evidence) used
// to be a plain <a target="_blank"> straight to /uploads/<file> — fine
// when the file is actually there, but Render's free-tier disk is
// ephemeral (wiped on every deploy/restart), so a file uploaded before an
// old deploy is simply gone. Clicking used to open a new tab showing a
// raw {"error":"Route not found..."} JSON blob with zero explanation,
// which read as "the app is broken" rather than "this specific old file
// didn't survive a redeploy." This checks first and explains the real
// cause instead of link-navigating blind.
// opts (optional): { ticketId } -- when present (a dispute's evidence,
// which always has two named parties), the viewer also offers "Send to
// Filer"/"Send to Vendor" so the admin can forward the file into either
// party's real chat thread. KYC documents have only one party (the
// submitter), so callers there omit opts and just get Back + Download.
async function openUploadedFile(url, opts) {
  if (!url) return;
  try {
    const res = await fetch(url, { method: 'HEAD' });
    if (res.ok) { showEvidenceViewerModal(url, opts || {}); return; }
  } catch (e) {}
  alert('This file is no longer on the server.\n\nHanda\'s current hosting (Render\'s free tier) doesn\'t keep uploaded files across every deploy/restart — this one was uploaded before a later deploy wiped it. Once real cloud file storage (e.g. Cloudinary) is connected, this will stop happening for new uploads. The person may need to re-submit the file if it\'s still needed.');
}
// Was a plain window.open(url,'_blank') straight to the raw file --
// jumped the admin out of the panel's own flow with no way back except
// closing the tab, and no way to download or forward the file to either
// party. This is a real in-panel viewer instead: a "Back to Admin" close
// action, a real same-origin download, and (for dispute evidence, which
// has two named parties) buttons to forward the file into either party's
// real chat thread.
function showEvidenceViewerModal(url, opts) {
  var existing = document.getElementById('evidence-viewer-modal'); if (existing) existing.remove();
  var isImage = /\.(png|jpe?g|gif|webp|bmp)(\?|$)/i.test(url);
  var filename = url.split('/').pop().split('?')[0];
  var sendButtons = opts.ticketId
    ? '<button class="action-btn" onclick="sendEvidenceToParty(\'' + url + '\',\'' + opts.ticketId + '\',\'filer\')">&#128172; Send to Filer</button> '
      + '<button class="action-btn" onclick="sendEvidenceToParty(\'' + url + '\',\'' + opts.ticketId + '\',\'vendor\')">&#128172; Send to Vendor</button>'
    : '';
  var html = '<div id="evidence-viewer-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10500;display:flex;align-items:center;justify-content:center;padding:16px;">'
    + '<div style="background:#1C1C1C;border:1px solid #2a2a2a;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:18px;font-family:inherit;">'
    + '<div style="margin-bottom:14px;"><button class="action-btn" onclick="closeEvidenceViewerModal()">&larr; Back to Admin</button></div>'
    + '<div style="font-weight:800;font-size:14px;color:#F2EDE8;margin-bottom:10px;word-break:break-all;">' + filename + '</div>'
    + (isImage
        ? '<img src="' + url + '" style="width:100%;border-radius:10px;margin-bottom:14px;display:block;">'
        : '<div style="padding:30px;text-align:center;color:#9A9390;border:1px dashed #2a2a2a;border-radius:10px;margin-bottom:14px;">No inline preview for this file type -- use Download to view it.</div>')
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
    + '<button class="action-btn" onclick="downloadEvidenceFile(\'' + url + '\')">&#8595; Download</button>'
    + sendButtons
    + '</div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}
function closeEvidenceViewerModal() {
  var el = document.getElementById('evidence-viewer-modal'); if (el) el.remove();
}
// download attribute forces a real browser save (not a navigation) for a
// same-origin URL like /uploads/<file> -- no fetch/blob dance needed.
function downloadEvidenceFile(url) {
  var a = document.createElement('a');
  a.href = url;
  a.download = url.split('/').pop().split('?')[0];
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// The filer's real role is always reliably known (t.user.role, straight
// off the ticket's own owner) -- used for "Resolved In {Role}'s Favor"
// when a refund means the filer won.
function _ticketFilerRoleLabel(t) {
  var role = t.user && t.user.role;
  return { CUSTOMER: 'Customer', VENDOR: 'Vendor', RIDER: 'Rider', SHOPPER: 'Shopper' }[role] || 'Filer';
}
// The OTHER party's role when there's no refund (the payee/second party
// won). Reliable for BOOKING context (always the vendor). SHOP_SESSION
// disputes can be against either a shopper or a rider, and the ticket has
// no separate field recording which -- best-effort from the report
// category's own wording (matches the real category lists this app
// actually uses for shopper-session vs. rider reports), falling back to
// whichever of the two SFM counterpart roles isn't the filer.
function _ticketPayeeRoleLabel(t) {
  if (t.context === 'BOOKING') return 'Vendor';
  var cat = (t.category || '').toLowerCase();
  if (cat.includes('driving') || cat.includes('rude') || cat.includes('damaged') || cat.includes('rider')) return 'Rider';
  if (cat.includes('behaviour') || cat.includes('described') || cat.includes('discrepancy') || cat.includes('shopper')) return 'Shopper';
  var filerRole = t.user && t.user.role;
  return filerRole === 'RIDER' ? 'Shopper' : filerRole === 'SHOPPER' ? 'Rider' : 'Vendor';
}

    + '<div style="width:110px;flex-shrink:0;color:#9A9390;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + label + '</div>'
    + '<div style="flex:1;background:#242424;border-radius:6px;overflow:hidden;height:18px;"><div style="width:' + pct + '%;background:#E8392E;height:100%;"></div></div>'
    + '<div style="width:90px;flex-shrink:0;text-align:right;font-weight:700;">' + money(kobo) + '</div>'
    + '</div>';
}

// Preserves the toolbar's current filter selections across re-renders —
// renderUsers() rebuilds the whole toolbar HTML from scratch every call,

// "All" after every Filter click even though the fetch itself used the

let _usersFilter = { role: '', state: '', q: '', page: 1 };
async function renderUsers() {
  const main = document.getElementById('main');
  const roleEl = document.getElementById('user-role'), stateEl = document.getElementById('user-state'), qEl = document.getElementById('user-q');
  if (roleEl) _usersFilter.role = roleEl.value;
  if (stateEl) _usersFilter.state = stateEl.value;
  if (qEl) _usersFilter.q = qEl.value;
  const f = _usersFilter;
  const pageSize = 25;
  main.innerHTML =
    '<h2>Users</h2>' +
    '<div class="toolbar">' +
      '<input id="user-q" placeholder="Search name/email/phone" value="' + (f.q || '').replace(/"/g, '&quot;') + '" onkeydown="if(event.key===\'Enter\'){_usersFilter.page=1;renderUsers();}">' +
      '<select id="user-role" onchange="_usersFilter.page=1;renderUsers()"><option value="">All roles</option>' + ['CUSTOMER', 'VENDOR', 'RIDER', 'SHOPPER', 'ADMIN'].map(r => '<option' + (f.role === r ? ' selected' : '') + '>' + r + '</option>').join('') + '</select>' +
      '<select id="user-state" onchange="_usersFilter.page=1;renderUsers()">' + stateFilterOptions(f.state) + '</select>' +
      '<button class="action-btn" onclick="_usersFilter.page=1;renderUsers()">Filter</button>' +
    '</div>' +
    '<div id="users-table" class="empty">Loading...</div>';
  try {
    const params = new URLSearchParams({ ...(f.role && { role: f.role }), ...(f.state && { state: f.state }), ...(f.q && { q: f.q }), page: f.page, pageSize });
    const data = await api('/admin/users?' + params.toString());
    const rows = data.users.map(u => {
      const extra = u.vendorProfile ? u.vendorProfile.bizName + (u.vendorProfile.isVerified ? ' ✓' : '') : (u.riderProfile ? 'Rider' : (u.shopperProfile ? 'Shopper' : ''));
      let verifyBtn = '';
      if (u.riderProfile) {
        verifyBtn = '<button class="action-btn" onclick="setProfileVerified(\'rider\',\'' + u.riderProfile.id + '\',' + (!u.riderProfile.isVerified) + ')">' + (u.riderProfile.isVerified ? 'Unverify' : 'Verify') + '</button>';
      } else if (u.shopperProfile) {
        verifyBtn = '<button class="action-btn" onclick="setProfileVerified(\'shopper\',\'' + u.shopperProfile.id + '\',' + (!u.shopperProfile.isVerified) + ')">' + (u.shopperProfile.isVerified ? 'Unverify' : 'Verify') + '</button>';
      }
      const outreachBtns = u.phone
        ? ' <button class="action-btn" onclick="openSmsModal(\'' + u.id + '\',' + JSON.stringify(u.name) + ')">Message</button> <button class="action-btn" onclick="callUser(\'' + u.id + '\',' + JSON.stringify(u.name) + ')">Call</button>'
        : '';
      const viewBtn = '<button class="action-btn" onclick="renderCustomerDetail(\'' + u.id + '\')">View</button> ';
      return '<tr><td>' + u.name + '</td><td>' + contactCell(u.email, u.phone, u.address) + '</td><td>' + u.role + '</td><td>' + (u.state || '—') + '</td><td>' + extra + '</td><td>' + pill(u.status) + '</td>' +
        '<td>' + viewBtn + statusToggleBtn(u, 'renderUsers()') + ' ' + verifyBtn + outreachBtns + '</td></tr>';
    }).join('');
    const totalPages = Math.max(1, Math.ceil(data.total / pageSize));
    const pager = '<div class="toolbar" style="margin-top:12px">'
      + '<button class="action-btn"' + (f.page <= 1 ? ' disabled' : '') + ' onclick="_usersFilter.page--;renderUsers()">&laquo; Prev</button>'
      + '<span style="color:#9A9390;padding:0 10px">Page ' + f.page + ' of ' + totalPages + ' (' + data.total + ' users)</span>'
      + '<button class="action-btn"' + (f.page >= totalPages ? ' disabled' : '') + ' onclick="_usersFilter.page++;renderUsers()">Next &raquo;</button>'
      + '</div>';
    document.getElementById('users-table').outerHTML = data.users.length
      ? '<table><thead><tr><th>Name</th><th>Contact</th><th>Role</th><th>State</th><th>Detail</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' + pager
      : '<div class="empty">No users found.</div>';
  } catch (e) {
    document.getElementById('users-table').textContent = e.message;
  }
}

// backFnCall: where to navigate once the account is actually gone (a detail
// view for a deleted user has nothing left to show) -- defaults to
// reloadFnCall for list rows, where reloading the same list is correct
// either way.
function statusToggleBtn(u, reloadFnCall, backFnCall) {
  if (u.status === 'SUSPENDED') {
    // The account name is passed via a data-* attribute (escHtml-escaped),
    // not as a JSON.stringify'd inline onclick argument -- a double-quoted
    // JSON string embedded inside this double-quoted onclick attribute
    // breaks (and silently mis-parses into garbage attributes) the moment
    // the name contains a space, which is true of virtually every real name.
    return '<span style="position:relative;display:inline-block">'
      + '<button class="action-btn" data-name="' + escHtml(u.name || 'this account') + '" onclick="toggleSuspendedMenu(this,\'' + u.id + '\',function(){' + reloadFnCall + '},function(){' + (backFnCall || reloadFnCall) + '})">Suspended &#9662;</button>'
      + '</span>';
  }
  return '<button class="action-btn" onclick="setUserStatusThenReload(\'' + u.id + '\',\'SUSPENDED\',function(){' + reloadFnCall + '})">Suspend</button>';
}
function toggleSuspendedMenu(btnEl, id, reload, goBack) {
  var name = btnEl.dataset.name || 'this account';
  document.querySelectorAll('.suspend-menu').forEach(function (m) { m.remove(); });
  var wrap = btnEl.parentElement;
  var menu = document.createElement('div');
  menu.className = 'suspend-menu';
  menu.style.cssText = 'position:absolute;top:100%;left:0;margin-top:4px;background:#1C1C1C;border:1.5px solid #333;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:9999;min-width:180px;overflow:hidden';

  var reactivateBtn = document.createElement('button');
  reactivateBtn.textContent = '↺ Reactivate';
  reactivateBtn.style.cssText = 'display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;color:#F2EDE8;font-size:13px;cursor:pointer';
  reactivateBtn.onmouseover = function () { this.style.background = '#2a2a2a'; };
  reactivateBtn.onmouseout = function () { this.style.background = 'none'; };
  reactivateBtn.onclick = function (e) { e.stopPropagation(); menu.remove(); setUserStatusThenReload(id, 'ACTIVE', reload); };
  menu.appendChild(reactivateBtn);

  if (currentUser.isSuperAdmin) {
    var deleteBtn = document.createElement('button');
    deleteBtn.textContent = '🗑 Delete Account';
    deleteBtn.style.cssText = 'display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;color:#E8392E;font-size:13px;cursor:pointer;border-top:1px solid #2a2a2a';
    deleteBtn.onmouseover = function () { this.style.background = '#2a1414'; };
    deleteBtn.onmouseout = function () { this.style.background = 'none'; };
    deleteBtn.onclick = function (e) { e.stopPropagation(); menu.remove(); confirmDeleteUser(id, name, goBack); };
    menu.appendChild(deleteBtn);
  }

  wrap.appendChild(menu);
  setTimeout(function () {
    document.addEventListener('click', function closeMenu(ev) {
      if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', closeMenu); }
    });
  }, 0);
}
async function confirmDeleteUser(id, name, goBack) {
  if (!confirm('Permanently delete ' + name + '\'s account?\n\nThis removes their profile from the platform for good and cannot be undone. If they have booking, rating, or order history other users depend on, the account will instead be permanently deactivated and logged out.')) return;
  try {
    const res = await api('/admin/users/' + id, { method: 'DELETE' });
    alert(res.message || (name + '\'s account was deleted.'));
    goBack();
  } catch (e) { alert(e.message); }
}

let _ticketsStatusFilter = '';
async function renderTickets(status) {
  if (status !== undefined) _ticketsStatusFilter = status;
  const main = document.getElementById('main');
  const statuses = ['', 'OPEN', 'IN_PROGRESS', 'RESOLVED', 'CLOSED'];
  main.innerHTML = '<h2>Support Tickets</h2>'
    + '<div class="toolbar"><select id="tickets-status-filter" onchange="renderTickets(this.value)">' + statuses.map(s => '<option value="' + s + '"' + (_ticketsStatusFilter === s ? ' selected' : '') + '>' + (s || 'All statuses') + '</option>').join('') + '</select></div>'
    + '<div id="tickets-table" class="empty">Loading...</div>';
  try {
    const data = await api('/support/tickets/all' + (_ticketsStatusFilter ? '?status=' + _ticketsStatusFilter : ''));
    const rows = data.tickets.map(t => {
      const disputeInfo = t.isDispute
        ? (t.requestedRefundKobo ? 'Requested: ' + money(t.requestedRefundKobo) : '')
          + (t.refundAmountKobo ? ' · Refunded: ' + money(t.refundAmountKobo) : '')
        : '';
      // A real, visible button for any submitted file -- gated purely on
      // the file actually being there, not on isDispute (a plain report
      // with an attached photo already flips isDispute true when it's
      // created, but this stays correct even if that ever changes). The
      // old version was a small inline <a> buried inside the Description
      // cell's text, easy to miss entirely.
      const evidenceButtons = (t.evidenceUrl ? '<button class="action-btn" onclick="openUploadedFile(\'' + t.evidenceUrl + '\',{ticketId:\'' + t.id + '\'})">&#128206; Filer\'s Evidence</button> ' : '')
        + (t.secondPartyEvidenceUrl ? '<button class="action-btn" onclick="openUploadedFile(\'' + t.secondPartyEvidenceUrl + '\',{ticketId:\'' + t.id + '\'})">&#128206; Vendor\'s Evidence</button>' : '');
      const actions = (t.status !== 'RESOLVED'
        ? '<button class="action-btn" onclick="resolveTicket(\'' + t.id + '\')">' + (t.isDispute ? 'Resolve For Vendor' : 'Resolve') + '</button>'
          + (t.isDispute && !t.refundAmountKobo ? ' <button class="action-btn" onclick="resolveTicketWithRefund(\'' + t.id + '\',' + (t.heldAmountKobo || 0) + ')">Resolve with Refund</button>' : '')
          + (t.isDispute && t.status === 'OPEN' ? ' <button class="action-btn" onclick="investigateTicket(\'' + t.id + '\')">Investigate</button>' : '')
        : '')
        + '<br><button class="action-btn" style="margin-top:6px" onclick="openTicketPartyChat(\'' + t.id + '\',\'filer\')">&#128172; Chat Filer</button>'
        + (t.isDispute ? ' <button class="action-btn" style="margin-top:6px" onclick="openTicketPartyChat(\'' + t.id + '\',\'vendor\')">&#128172; Chat Vendor</button>' : '')
        + (evidenceButtons ? '<br><span style="display:inline-block;margin-top:6px">' + evidenceButtons + '</span>' : '');
      const secondSide = t.secondPartyResponse
        ? '<br><small onclick="alert(' + JSON.stringify(t.secondPartyResponse) + ')" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;" title="Click to read the full message"><b>Other side:</b> ' + t.secondPartyResponse.slice(0, 150) + '</small>'
        : '';
      const description = t.description || '';
      const descHtml = description
        ? '<span onclick="alert(' + JSON.stringify(description) + ')" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;" title="Click to read the full message">' + description.slice(0, 60) + (description.length > 60 ? '…' : '') + '</span>'
        : '—';
      // A bare "RESOLVED" pill didn't say which side actually won -- the
      // refund flag already tells us that (a refund means the filer won;
      // no refund means the payee/other party won), just needs a real
      // role label instead of a fixed status word. Class comes from
      // STATUS_PILL[t.status] as normal (still green); only the text changes.
      const statusLabel = (t.status === 'RESOLVED' && t.isDispute)
        ? 'Resolved In ' + (t.refundAmountKobo ? _ticketFilerRoleLabel(t) : _ticketPayeeRoleLabel(t)) + "'s Favor"
        : t.status;
      return '<tr><td>' + t.category + (t.isDispute ? ' <span class="pill amber">DISPUTE</span>' : '') + '</td><td>' + t.context + '</td><td>' + (t.user ? t.user.name : '—') + '</td><td>' + descHtml + '<br><small>' + disputeInfo + '</small>' + secondSide + '</td>' +
        '<td><span class="pill ' + (STATUS_PILL[t.status] || 'grey') + '">' + statusLabel + '</span></td>' +
        '<td>' + actions + '</td></tr>';
    }).join('');
    document.getElementById('tickets-table').outerHTML = data.tickets.length
      ? '<table><thead><tr><th>Category</th><th>Context</th><th>User</th><th>Description</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="empty">No support tickets.</div>';
  } catch (e) {
    document.getElementById('tickets-table').textContent = e.message;
  }
}
// Proactively opens (finds-or-creates) a real per-ticket, per-party chat
// straight from a ticket row — a separate thread per (ticket, party), so
// a user's disputes across different bookings no longer collide into one
// shared conversation. "Chat Vendor" resolves the vendor straight from the
// ticket's booking context server-side, so it's available immediately,
// not only once the vendor has already responded.
async function openTicketPartyChat(ticketId, party) {
  try {
    const data = await api('/admin/tickets/' + ticketId + '/chat/' + party, { method: 'POST' });
    renderChatThreadDetail(data.thread.id);
  } catch (e) {
    alert(e.message);
  }

let _codesFile = 'app/index.html';
let _codesOriginalLength = 0;

// Raw fetches here bypass api() (which forces JSON), so they need their
// own timeout — a stalled request otherwise hangs the Load/Save button
// forever with no feedback.
async function fetchWithTimeout(url, opts, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 45000);
  try {
    return await fetch(url, { ...opts, signal: controller.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Request timed out — the server took too long to respond.');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

  const main = document.getElementById('main');
  const canSave = currentUser.isSuperAdmin;
  window._codesDirty = false;
  main.innerHTML =

    '<p style="color:#9A9390;margin:-8px 0 16px">Load a live frontend file\'s full raw source, edit it, and save. A backup is taken before every save, and the save is rejected if the new content fails a script syntax check.</p>' +
    (canSave ? '' : '<p class="warn-box">View only — only the Super Admin can save changes to live code.</p>') +
    '<div class="toolbar">' +
      '<select id="codes-file">' + ceFileOptions() + '</select>' +
      '<button class="action-btn" onclick="codesLoad()">Load</button>' +
      '<button class="action-btn" onclick="codesReload()">Reload</button>' +
      '<input id="codes-find" placeholder="Find in loaded text (case-insensitive)..." style="min-width:200px" onkeydown="if(event.key===\'Enter\')codesFind()">' +
      '<button class="action-btn" onclick="codesFind()">Find next</button>' +
      (canSave ? '<button class="btn" style="width:auto;padding:8px 16px" onclick="codesSave()">Save</button>' : '') +
    '</div>' +

    _codesFile = e.target.value;

async function codesLoad() {
  _codesFile = document.getElementById('codes-file').value;
  const ta = document.getElementById('codes-textarea');
  const errEl = document.getElementById('codes-err');
  errEl.textContent = '';
  ta.value = 'Loading...';
  try {
    const res = await fetchWithTimeout(API + '/admin/files/content?file=' + encodeURIComponent(_codesFile), { headers: authHeaders() });
    if (!res.ok) throw new Error('Failed to load (' + res.status + ')');
    const text = await res.text();
    ta.value = text;
    _codesOriginalLength = text.length;
    window._codesDirty = false;
  } catch (e) {
    ta.value = '';
    errEl.textContent = e.message;
  }
}

function codesReload() {
  if (window._codesDirty && !confirm('Discard your unsaved edits and reload ' + _codesFile + ' from the server?')) return;
  codesLoad();
}

let _codesFindFrom = 0;
function codesFind() {
  const ta = document.getElementById('codes-textarea');
  const q = document.getElementById('codes-find').value;
  if (!q) return;
  const hay = ta.value.toLowerCase();
  const needle = q.toLowerCase();
  let idx = hay.indexOf(needle, _codesFindFrom);
  let wrapped = false;
  if (idx === -1) { idx = hay.indexOf(needle, 0); wrapped = true; }
  if (idx === -1) { alert('Not found.'); _codesFindFrom = 0; return; }
  ta.focus();
  ta.setSelectionRange(idx, idx + q.length);
  const lineHeight = parseFloat(getComputedStyle(ta).lineHeight) || 18;
  const linesBefore = ta.value.slice(0, idx).split('\n').length;
  ta.scrollTop = Math.max(0, (linesBefore - 5) * lineHeight);
  _codesFindFrom = idx + q.length;
  if (wrapped) {
    const errEl = document.getElementById('codes-err');
    if (errEl) { errEl.style.color = '#9A9390'; errEl.textContent = 'Wrapped to top of file.'; setTimeout(() => { if (errEl.textContent === 'Wrapped to top of file.') errEl.textContent = ''; }, 2500); }
  }
}

async function codesSave(confirmDrasticShrink) {
  const ta = document.getElementById('codes-textarea');
  const errEl = document.getElementById('codes-err');
  errEl.style.color = '';
  errEl.textContent = '';
  const content = ta.value;
  if (!content) { errEl.textContent = 'Nothing loaded — click Load first.'; return; }
  if (!confirm('Save changes to ' + _codesFile + '? A backup of the current live version will be taken first.')) return;
  try {
    const url = API + '/admin/files/save?file=' + encodeURIComponent(_codesFile) + (confirmDrasticShrink ? '&confirmDrasticShrink=true' : '');
    const res = await fetchWithTimeout(url, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'text/plain' }, body: content });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 409 && data.newSizeBytes !== undefined) {
        if (confirm('New content is ' + Math.round(data.newSizeBytes / 1024) + 'KB vs current ' + Math.round(data.currentSizeBytes / 1024) + 'KB — more than half smaller. This often means content was lost. Save anyway?')) {
          return codesSave(true);
        }
        return;
      }
      throw new Error(data.error || ('Save failed (' + res.status + ')'));
    }
    alert('Saved. Backup: ' + data.backupName);
    _codesOriginalLength = content.length;
    window._codesDirty = false;
  } catch (e) {
    errEl.textContent = e.message;
  }
}

// ── Live Preview: embed the real app/admin pages so a screen change can be
// checked visually right after a Code Editor / Codes edit, without leaving
// the admin panel. Same-origin iframe, so jump-to-screen can call the
// embedded page's own eGo() directly through contentWindow. ──
function livePreviewFileOptions() {
  return ['app/index.html', 'app-dev/index.html', 'admin/index.html', 'admin-dev/index.html']
    .map(f => '<option value="' + f + '">' + f + '</option>').join('');
}
async function renderLivePreview() {
  const main = document.getElementById('main');
  const file = document.getElementById('lp-file') ? document.getElementById('lp-file').value : 'app-dev/index.html';
  const jumpTargets = FEATURE_INDEX.filter(f => f.screen);
  main.innerHTML =
    '<h2>Live Preview</h2>' +
    '<p style="color:#9A9390;margin:-8px 0 16px">Embeds the real page so you can check a change visually. Use the -dev files to preview edits made in the Code Editor / Codes tools before touching the live file.</p>' +
    '<div class="toolbar">' +
      '<select id="lp-file" onchange="renderLivePreview()">' + livePreviewFileOptions() + '</select>' +
      '<select id="lp-jump"><option value="">Jump to screen…</option>' + jumpTargets.map(f => '<option value="' + f.screen + '">' + f.label + '</option>').join('') + '</select>' +
      '<button class="action-btn" onclick="lpJump()">Go</button>' +
      '<button class="action-btn" onclick="lpReload()">Reload</button>' +
    '</div>' +
    '<iframe id="lp-frame" src="/' + file + '" style="width:100%;height:75vh;border:1px solid #2a2a2a;border-radius:10px;background:#111"></iframe>';
  document.getElementById('lp-file').value = file;
}
function lpJump() {
  const screen = document.getElementById('lp-jump').value;
  if (!screen) return;
  const frame = document.getElementById('lp-frame');
  try {
    if (frame.contentWindow && typeof frame.contentWindow.eGo === 'function') frame.contentWindow.eGo(screen);
    else alert('Preview page hasn\'t finished loading yet, or has no eGo() (this may be the admin panel itself, which uses switchTab instead).');
  } catch (e) {
    alert('Could not jump: ' + e.message);
  }
}
function lpReload() {
  const frame = document.getElementById('lp-frame');
  if (frame) frame.src = frame.src;
}

  errEl.textContent = '';
  if (!body) { errEl.textContent = 'Message is required.'; return; }
  const userIds = scope === 'pick' ? Object.keys(_bsSelected) : undefined;
  if (scope === 'pick' && !userIds.length) { errEl.textContent = 'Select at least one recipient, or switch to "All active users".'; return; }
  const confirmMsg = scope === 'pick' ? 'Send this SMS to ' + userIds.length + ' selected user(s)?' : 'Send this SMS to ALL active users with a phone number on file?';
  if (!confirm(confirmMsg)) return;
  try {
    const data = await api('/admin/bulk-sms', { method: 'POST', body: JSON.stringify({ body, userIds }) });
    alert('Sent to ' + data.bulkSms.sentCount + ' recipient(s)' + (data.bulkSms.failedCount ? ', ' + data.bulkSms.failedCount + ' failed' : '') + '.');
    document.getElementById('bs-body').value = '';
    _bsSelected = {};
    renderBulkSms();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

// view polls every 8s while open instead, same tier of real-time-ness as
// the rest of this pull-based panel. ──
async function renderChatThreads() {
  const main = document.getElementById('main');
  main.innerHTML =
    '<h2>Live Chat</h2>' +

    '<div id="chat-threads-table" class="empty">Loading...</div>';
  try {
    const data = await api('/admin/chat-threads');
    const rows = data.threads.map(t => {
      const customer = (t.participants.find(p => p.user.role === 'CUSTOMER') || t.participants[0] || {}).user;
      const last = t.messages[0];
      const statusPill = t.closedAt ? '<span class="pill grey">Closed</span>' : (t.handledByAdminId ? '<span class="pill green">Human</span>' : '<span class="pill amber">AI</span>');
      return '<tr style="cursor:pointer" onclick="renderChatThreadDetail(\'' + t.id + '\')"><td>' + (customer ? escHtml(customer.name) : '—') + '</td>' +
        '<td>' + (t.contextLabel || 'Support') + '</td>' +
        '<td style="max-width:320px">' + (last ? escHtml(last.body).slice(0, 140) : '—') + '</td>' +
        '<td>' + statusPill + '</td>' +
        '<td>' + (last ? new Date(last.createdAt).toLocaleString() : new Date(t.createdAt).toLocaleString()) + '</td></tr>';
    }).join('');
    document.getElementById('chat-threads-table').outerHTML = data.threads.length
      ? '<table><thead><tr><th>Customer</th><th>Type</th><th>Last message</th><th>Status</th><th>When</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="empty">No support chats yet.</div>';
  } catch (e) {
    document.getElementById('chat-threads-table').textContent = e.message;

function stopChatThreadAutoRefresh() {
  if (window._chatThreadRefreshTimer) { clearInterval(window._chatThreadRefreshTimer); window._chatThreadRefreshTimer = null; }
  window._chatThreadDetailId = null;
}

async function renderChatThreadDetail(id) {
  const main = document.getElementById('main');
  main.innerHTML =
    '<button class="action-btn" style="margin-bottom:14px" onclick="stopChatThreadAutoRefresh();switchTab(\'chatthreads\')">&larr; Back to list</button>' +
    '<h2>Support Chat <button class="action-btn" id="chat-thread-close-btn" style="margin-left:10px;display:none" onclick="closeChatThreadDetail(\'' + id + '\')">&#128274; Close Chat</button></h2>' +
    '<div id="chat-thread-msgs" class="empty" style="background:#181818;border:1px solid #2A2850;border-radius:12px;padding:16px;margin-bottom:12px;max-height:420px;overflow-y:auto;">Loading...</div>' +
    '<input type="file" id="chat-thread-attach-inp" accept="image/*" style="display:none" onchange="sendChatThreadAttachment(\'' + id + '\', this)">' +
    '<div id="chat-thread-composer" style="display:flex;gap:8px;">' +
    '<button class="action-btn" onclick="document.getElementById(\'chat-thread-attach-inp\').click()" title="Attach evidence/photo">&#128206;</button>' +
    '<input id="chat-thread-reply" placeholder="Type a reply..." style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid #2A2850;background:#1C1C1C;color:#F2EDE8;" onkeydown="if(event.key===\'Enter\'){sendChatThreadReply(\'' + id + '\');}">' +
    '<button class="action-btn" onclick="sendChatThreadReply(\'' + id + '\')">Send</button></div>';
  window._chatThreadDetailId = id;
  await loadChatThreadDetail(id);
  if (window._chatThreadRefreshTimer) clearInterval(window._chatThreadRefreshTimer);
  window._chatThreadRefreshTimer = setInterval(() => { if (window._chatThreadDetailId === id) loadChatThreadDetail(id); }, 8000);
}

// Only touches the messages pane, never the reply input/attach controls --
// the 8s auto-refresh used to rebuild the whole panel every tick, wiping
// out whatever the admin was mid-typing in the reply box.
async function loadChatThreadDetail(id) {
  const msgsEl = document.getElementById('chat-thread-msgs');
  if (!msgsEl) return;
  try {
    const data = await api('/admin/chat-threads/' + id + '/messages');
    const bubbles = data.messages.map(m => {
      const mine = m.sender.role === 'ADMIN';
      const img = m.attachmentUrl ? ('<a href="' + m.attachmentUrl + '" target="_blank"><img src="' + m.attachmentUrl + '" style="max-width:160px;max-height:160px;border-radius:8px;display:block;' + (m.body ? 'margin-bottom:6px;' : '') + '"></a>') : '';
      return '<div style="max-width:70%;margin-bottom:8px;' + (mine ? 'margin-left:auto;text-align:right;' : '') + '">' +
        '<div style="font-size:11px;color:#9A9390;margin-bottom:2px;">' + escHtml(m.sender.name) + '</div>' +
        '<div style="display:inline-block;padding:9px 12px;border-radius:10px;text-align:left;background:' + (mine ? '#2ECC71' : '#242424') + ';color:' + (mine ? '#111' : '#F2EDE8') + ';font-size:13px;">' + img + (m.body ? escHtml(m.body) : '') + '</div></div>';
    }).join('');
    msgsEl.classList.remove('empty');
    msgsEl.innerHTML = bubbles || '<div class="empty">No messages yet.</div>';
    msgsEl.scrollTop = msgsEl.scrollHeight;

    const closeBtn = document.getElementById('chat-thread-close-btn');
    const composer = document.getElementById('chat-thread-composer');
    const closed = data.thread && data.thread.closedAt;
    if (closeBtn) closeBtn.style.display = closed ? 'none' : 'inline-block';
    // Only ever swap the composer to the "ended" placeholder, and only
    // once -- reassigning outerHTML on every refresh tick (even to itself)
    // would destroy and recreate the input every 8s, wiping out whatever
    // the admin was mid-typing and stealing focus.
    if (composer && closed && !composer.dataset.ended) {
      composer.outerHTML = '<div id="chat-thread-composer" data-ended="1" style="padding:10px 12px;border-radius:10px;background:#242424;color:#9A9390;font-size:13px;">This chat has ended.</div>';
    }
  } catch (e) {
    msgsEl.textContent = e.message;
  }
}

async function closeChatThreadDetail(id) {
  if (!confirm('Close this chat? Neither party will be able to send further messages on it.')) return;
  try {
    await api('/admin/chat-threads/' + id + '/close', { method: 'POST' });
    await loadChatThreadDetail(id);
  } catch (e) {
    alert(e.message);
  }
}

async function sendChatThreadReply(id) {
  const inp = document.getElementById('chat-thread-reply');
  const body = inp.value.trim();
  if (!body) return;
  inp.value = '';
  try {
    await api('/admin/chat-threads/' + id + '/messages', { method: 'POST', body: JSON.stringify({ body }) });
    await loadChatThreadDetail(id);
  } catch (e) {
    alert(e.message);
  }
}

// Real evidence/proof upload for the admin's side of a dispute
// conversation — mirrors the customer app's sendChatAttachment.
async function sendChatThreadAttachment(id, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  try {
    const fd = new FormData();
    fd.append('file', file);
    const upRes = await fetch(API + '/admin/chat-threads/' + id + '/attachment', {
      method: 'POST', headers: authHeaders(), body: fd,
    });
    const upData = await upRes.json().catch(() => ({}));
    if (!upRes.ok) throw new Error(upData.error || 'Could not upload the photo');
    await api('/admin/chat-threads/' + id + '/messages', { method: 'POST', body: JSON.stringify({ attachmentUrl: upData.url }) });
    await loadChatThreadDetail(id);
  } catch (e) {
    alert(e.message);
  } finally {
    inputEl.value = '';
  }
}

async function submitAddAdmin() {
  const name = document.getElementById('na-name').value.trim();
  const email = document.getElementById('na-email').value.trim();
  const password = document.getElementById('na-password').value;
  const tier = document.getElementById('na-tier').value;
  const err = document.getElementById('na-err');
  err.textContent = '';
  try {
    await api('/admin/admins', { method: 'POST', body: JSON.stringify({ name, email, password, tier }) });
    document.getElementById('add-admin-form').innerHTML = '';
    renderAdmins();
  } catch (e) {
    err.textContent = e.message;
  }
}
async function suspendAdmin(id) {
  try { await api('/admin/admins/' + id + '/suspend', { method: 'PATCH' }); renderAdmins(); }
  catch (e) { alert(e.message); }
}
async function reactivateAdmin(id) {
  try { await api('/admin/admins/' + id + '/reactivate', { method: 'PATCH' }); renderAdmins(); }
  catch (e) { alert(e.message); }
}
async function removeAdmin(id, name) {
  if (!confirm('Remove admin "' + name + '"? They will be logged out immediately and can no longer sign in.')) return;
  try { await api('/admin/admins/' + id + '/remove', { method: 'PATCH' }); renderAdmins(); }
  catch (e) { alert(e.message); }
}
